name: Test Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install jq dependency
        run: |
          sudo apt-get update && sudo apt-get install -y jq
      
      - name: Install project
        run: |
          python -m venv fixy-env
          source fixy-env/bin/activate
          pip install -e ".[dev]" 2>/dev/null || pip install -e .
          pip install pytest pytest-cov
      
      - name: Run pytest
        run: |
          source fixy-env/bin/activate
          python3 -m pytest tests/ --cov=wiz_central_toolkit --cov-report=xml
      
      - name: Run wizard validation harness
        run: |
          source fixy-env/bin/activate
          chmod +x test-all-wizards.sh
          ./test-all-wizards.sh
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  validate-license:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Verify LICENSE exists
        run: |
          if [ ! -f LICENSE ]; then
            echo "[FAIL] LICENSE file missing"
            exit 1
          fi
          grep -q "Apache License" LICENSE
          echo "[PASS] LICENSE verified"
      
      - name: Verify Apache 2.0 patent clauses
        run: |
          grep -q "patent litigation" LICENSE
          grep -q "terminate" LICENSE
          echo "[PASS] Patent clauses present"
