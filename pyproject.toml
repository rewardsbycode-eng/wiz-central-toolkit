[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wiz-central-toolkit"
version = "0.1.0"
description = "Wizard Central Toolkit — focused, reliable command-line tools for developers"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "rewardsbycode-eng" }]
dependencies = [
    "pyfiglet>=1.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
wiz = "wiz_central_toolkit.wiz.__main__:main"
godfatherwiz = "wiz_central_toolkit.godfatherwiz.__main__:main"

[project.urls]
Homepage = "https://github.com/rewardsbycode-eng/wiz-central-toolkit"
Repository = "https://github.com/rewardsbycode-eng/wiz-central-toolkit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["wiz_central_toolkit"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
